server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: incident-copilot-infrastructure-simulator

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

incident-copilot:
  cors:
    allowed-origins: http://localhost:8000,http://127.0.0.1:8000,http://localhost:8501,http://127.0.0.1:8501
