services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_copilot
      POSTGRES_USER: incident_copilot
      POSTGRES_PASSWORD: incident_copilot
    ports:
      - "5432:5432"
    volumes:
      - incident-copilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_copilot -d incident_copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    build:
      context: ./simulator-java
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://incident_copilot:incident_copilot@postgres:5432/incident_copilot
      SIMULATOR_BASE_URL: http://simulator:8081
      RUNBOOK_DIRECTORY: /runbooks
      DASHBOARD_ORIGIN: http://localhost:8501
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-demo-monitoring-token-change-me}
      ALERTMANAGER_AUTO_INVESTIGATE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - incident-copilot-prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - simulator
      - alertmanager

  dashboard:
    build:
      context: ./dashboard
    environment:
      INCIDENT_COPILOT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  incident-copilot-postgres:
  incident-copilot-prometheus:
