global:
  resolve_timeout: 30s

route:
  receiver: incident-copilot
  group_by:
    - alertname
    - service
    - environment
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 5m

receivers:
  - name: incident-copilot
    webhook_configs:
      - url: http://api:8000/api/v1/integrations/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: demo-monitoring-token-change-me
