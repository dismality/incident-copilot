global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: incident-copilot-simulator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - simulator:8081

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
